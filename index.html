<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifestyle by Hills - Luxury Rentals</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
</head>
<body>
    <header>
        <h1>Lifestyle by Hills</h1>
        <nav>
            <ul>
                <li><a href="#properties">Properties</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#booking">Book Now</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero">
            <div class="swiper">
                <div class="swiper-wrapper">
                    <!-- Add your property images here -->
                    <div class="swiper-slide"><img src="property1.jpg" alt="Property 1"></div>
                    <div class="swiper-slide"><img src="property2.jpg" alt="Property 2"></div>
                    <div class="swiper-slide"><img src="property3.jpg" alt="Property 3"></div>
                </div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>
        </section>

        <section id="properties">
            <h2>Our Properties</h2>
            <div class="property-grid">
                <!-- Add your property cards here -->
                <div class="property-card">
                    <img src="property1.jpg" alt="Property 1">
                    <h3>Luxury Beach House</h3>
                    <p>3 Bedrooms • 2 Bathrooms • Ocean View</p>
                    <button onclick="openBooking('property1')">Book Now</button>
                </div>
                <!-- Add more property cards as needed -->
            </div>
        </section>

        <section id="booking">
            <h2>Book Your Stay</h2>
            <div id="booking-calendar"></div>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <p>Email: bookings@lifestylebyhills.com</p>
            <p>Phone: (555) 123-4567</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Lifestyle by Hills. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
